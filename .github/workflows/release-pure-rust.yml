name: Build & Release Haven Pure Rust (Pre-Release)

on:
  push:
    branches:
      - main
    tags:
      - 'v*-pre*'
      - 'v*-alpha*'
      - 'v*-beta*'
      - 'v*-rust*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for pre-release (e.g. v0.2.0-pre.5)'
        required: false
        default: 'v0.2.0-pre.5'

permissions:
  contents: write

jobs:
  build-release-pure-rust:
    name: Build Pure Rust Native Client (Pre-Release)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Run Native Tests
        run: cargo test -- --nocapture

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Executable
        run: |
          Copy-Item -Path "target/release/haven-native.exe" -Destination "haven-desktop-pure-rust.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: haven-desktop-pure-rust-windows-x64
          path: haven-desktop-pure-rust.exe

      - name: Create GitHub Pre-Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Haven Pure Rust Native ${{ github.event.inputs.tag_name || github.ref_name || 'v0.2.0-pre.5' }} (Pre-Release)
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Haven Pure Rust Native - Pre-Release Build
            * **Note:** Released as a Pre-release preview build.
            * **Architecture:** 100% Pure Rust Native Client (Zero Chromium / Zero WebView2, Slint UI + WASAPI audio + Win32 click-through overlay).
            * **What's New in v0.2.0-pre.5 (Wave 2 UX & Reliability):**
              - **Bounded LRU Channel History (`ChannelHistoryLru(12, 80)`):** Instant channel switching from lightweight `CachedMessageMeta` without pinning decoded RGBA image buffers past the 48 MB image cache limit.
              - **`clientNonce` Optimistic Reconciliation:** Instant pending bubble rendering matched via echoed `clientNonce` (resilient to `display_name != username`), automatic removal on `error-msg`, and full UTC timestamp/avatar replacement upon confirmation.
              - **Reconnect & Rapid-Switch Guards:** Clears stale channel cache on WebSocket connect/disconnect and validates active channel on UI dispatch to prevent cross-channel overwrites.
              - **Safe UTF-8 Timestamp Formatting:** Non-panicking UTC `HH:MM` formatting and loading banner state cleanup on disconnect/error.
          prerelease: true
          draft: false
          files: |
            haven-desktop-pure-rust.exe
