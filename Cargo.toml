[package]
name = "haven-native"
version = "0.2.0-pre.4"
edition = "2021"
authors = ["Haven Contributors <ancsemi@haven-app.com>"]
license = "AGPL-3.0"
repository = "https://github.com/khanhtg2011/haven-native"
description = "Haven Native: Pure Rust 100% Desktop Client (Pre-Release)"

[lib]
name = "haven_native"
path = "src/lib.rs"

[[bin]]
name = "haven-native"
path = "src/main.rs"

[dependencies]
slint = "1.8"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
cpal = "0.15"
ringbuf = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Shell"
] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
